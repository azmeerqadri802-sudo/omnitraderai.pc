name: Build Windows executable

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Omni Trader executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name OmniTrader --collect-all keyring
          --hidden-import keyring.backends.Windows
          --hidden-import win32cred --hidden-import win32api
          --hidden-import pywintypes --hidden-import pythoncom
          main.py

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: OmniTrader-Windows-${{ github.sha }}
          path: dist/OmniTrader.exe
          if-no-files-found: error
          retention-days: 30
